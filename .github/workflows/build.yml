name: MCHosting V8 - Gradle Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP Ac
        run: |
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Versiyonlari Duzelt
        run: |
          echo "=== Onceki surumler ==="
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || find . -name "gradle-wrapper.properties" -exec cat {} \;
          find . -name "build.gradle" | xargs grep -h "com.android.application" | head -5
          find . -name "build.gradle" | xargs grep -h "com.android.tools.build:gradle" | head -5
          
          echo "=== Gradle Wrapper 8.9 yapiliyor ==="
          # wrapper properties guncelle
          find . -name "gradle-wrapper.properties" -exec sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|' {} \;
          
          echo "=== AGP 8.4.2 yapiliyor ==="
          # top-level build.gradle deki AGP surumunu guncelle
          find . -maxdepth 4 -name "build.gradle" | xargs grep -l "com.android.tools.build:gradle" | while read f; do
            echo "Fix $f"
            sed -i -E "s/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.4.2/g" "$f"
            cat "$f" | head -50
          done
          
          # libs.versions.toml varsa
          find . -name "libs.versions.toml" -exec sed -i -E "s/androidGradlePlugin = \"[0-9.]+\"/androidGradlePlugin = \"8.4.2\"/; s/agp = \"[0-9.]+\"/agp = \"8.4.2\"/" {} \; || true
          
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null
          find . -name "gradle-wrapper.properties" -exec cat {} \; | head -20

      - name: Proje Hazirla
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          find . -name "gradlew" -type f -exec chmod +x {} \;
          find . -name "gradlew" -type f -exec sh -c 'dir=$(dirname "$1"); echo "sdk.dir=$ANDROID_HOME" > "$dir/local.properties"' _ {} \;
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # buildFeatures fix - daha temiz
          APP=$(find . -type f -path "*app/build.gradle" | head -1)
          if [ -z "$APP" ]; then APP=$(grep -rl "com.android.application" --include="*.gradle" . | head -1); fi
          echo "APP=$APP"
          if [ -f "$APP" ]; then
            # dataBinding zaten varsa elleme, yoksa ekle
            if ! grep -q "dataBinding" "$APP"; then
              python3 <<PY
          import pathlib
          f=pathlib.Path("$APP")
          s=f.read_text()
          if "buildFeatures" not in s:
              s=s.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }",1)
              f.write_text(s)
              print("added buildFeatures")
          PY
            fi
            # enableV2 gibi eski seyleri temizle
            sed -i '/dataBinding {/,/}/d' "$APP" || true
            sed -i '/android.databinding.enabled/d' "$APP" || true
            cat "$APP" | head -200
          fi

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          GRADLEW=$(find . -type f -name "gradlew" | head -1)
          ROOT=$(dirname "$GRADLEW")
          echo "ROOT=$ROOT"
          cd "$ROOT"
          ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
