name: MCHosting V6 - Final

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP'i ac ve Proje Bul
        run: |
          set -x
          pwd
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done
          for z in **/*.zip; do [ -f "$z" ] && unzip -o "$z" -d $(dirname "$z") && rm "$z"; done || true
          echo "=== GRADLEW LOKASYONLARI ==="
          find . -name "gradlew" -type f
          echo "=== BUILD.GRADLE ==="
          find . -name "build.gradle" | head -10

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3

      - name: local.properties ve Fix
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find . -name "local.properties" -exec cat {} \;
          # En gercek proje kokunu bul ve oraya da kopyala
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          ROOT=$(dirname "$GRADLEW")
          echo "ROOT=$ROOT"
          echo "sdk.dir=$ANDROID_HOME" > "$ROOT/local.properties"
          cat "$ROOT/local.properties"
          # buildFeatures fix - sadece app modulu
          APP_BUILD=$(find . -path "*/app/build.gradle" | head -1)
          if [ -z "$APP_BUILD" ]; then APP_BUILD=$(find . -name "build.gradle" | xargs grep -l "com.android.application" 2>/dev/null | head -1); fi
          echo "APP_BUILD=$APP_BUILD"
          if [ -f "$APP_BUILD" ] && ! grep -q "dataBinding" "$APP_BUILD"; then
            echo "Fix uygulaniyor: $APP_BUILD"
            # yedek al
            cp "$APP_BUILD" "$APP_BUILD.bak"
            # android blokundan sonra ekle - daha guvenli
            python3 <<PY
          import pathlib
          p = pathlib.Path("$APP_BUILD")
          t = p.read_text()
          if "buildFeatures" not in t:
              t = t.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }", 1)
              p.write_text(t)
              print("fixed")
          else:
              print("already has buildFeatures")
          PY
            cat "$APP_BUILD" | head -200
          fi

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          ROOT=$(dirname "$GRADLEW")
          echo "Gradlew: $GRADLEW"
          echo "Root: $ROOT"
          ls -la "$ROOT"
          chmod +x "$GRADLEW"
          cd "$ROOT"
          pwd
          ls -la
          ./gradlew assembleDebug --stacktrace

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
