name: MCHosting V13 - FINAL FINAL

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP Ac
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done || true
          ls -la
          echo "MCHosting icerik:"
          ls -la MCHosting/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 7.6.3 Kur
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.3

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3" "platforms;android-33" || true

      - name: TUM FIXLER BIR ARADA
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          ROOT="MCHosting"
          
          # 1. settings.gradle duzelt
          cat > $ROOT/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MCHosting"
          include ':app'
          EOF
          
          # 2. gradle.properties - EN ONEMLI
          cat > $ROOT/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=34
          EOF
          
          # 3. local.properties
          echo "sdk.dir=$ANDROID_HOME" > $ROOT/local.properties
          
          # 4. gradlew yoksa olustur
          if [ ! -f "$ROOT/gradlew" ]; then
            echo "gradlew yok, olusturuluyor..."
            cd $ROOT
            gradle wrapper --gradle-version 7.6.3
            cd ..
          fi
          
          chmod +x $ROOT/gradlew || true
          chmod +x $ROOT/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          
          # 5. dataBinding fix
          APP="$ROOT/app/build.gradle"
          echo "APP=$APP"
          cat "$APP" | head -60
          if ! grep -q "dataBinding" "$APP"; then
            python3 <<PY
          import pathlib
          p=pathlib.Path("$APP")
          s=p.read_text()
          if "buildFeatures" not in s:
              s=s.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }",1)
              p.write_text(s)
              print("dataBinding eklendi")
          PY
          fi
          
          echo "=== FINAL KONTROLLER ==="
          cat $ROOT/settings.gradle
          cat $ROOT/gradle.properties
          cat $ROOT/local.properties
          ls -la $ROOT/
          ls -la $ROOT/app/ | head -20

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          cd MCHosting
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
