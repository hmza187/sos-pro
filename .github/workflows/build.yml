name: MCHosting APK Yapici V4

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: ZIP'i ac
        run: |
          ls -la
          for z in *.zip; do [ -e "$z" ] && echo "Aciliyor: $z" && unzip -o "$z" && rm "$z"; done
          for z in **/*.zip; do [ -e "$z" ] && echo "ic zip: $z" && unzip -o "$z" -d $(dirname "$z") && rm "$z"; done || true
          ls -la
          find . -name "gradlew" | head -5

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3

      - name: dataBinding Fix
        run: |
          FILE=$(find . -name "build.gradle" -type f | xargs grep -l "com.android.application" | head -1)
          echo "App build.gradle: $FILE"
          if [ -f "$FILE" ]; then
            if ! grep -q "dataBinding" "$FILE"; then
              echo "dataBinding ekleniyor..."
              # android { sonrasi
              perl -i -pe 'BEGIN{undef $/;} s/android\s*\{/android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }/s' "$FILE" || true
              # alternatif sed
              grep -q "buildFeatures" "$FILE" || sed -i '/^android {/a \    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }' "$FILE"
            fi
            cat "$FILE"
          fi

      - name: Gradle'a izin ver
        run: find . -name "gradlew" -exec chmod +x {} \;

      - name: APK Derle
        run: |
          ROOT=$(find . -name "gradlew" | head -1 | xargs dirname)
          echo "Proje kok: $ROOT"
          cd "$ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: APK'yi Yükle
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
