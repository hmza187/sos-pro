name: MCHosting V11 - Settings Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP Ac
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done || true
          ls -la MCHosting/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.3

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" || true

      - name: Settings.gradle Duzelt
        run: |
          echo "=== Onceki settings.gradle ==="
          cat MCHosting/settings.gradle || cat settings.gradle || true
          echo ""
          echo "=== Yeni settings.gradle yaziliyor ==="
          # MCHosting icin duzgun settings.gradle
          cat > MCHosting/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MCHosting"
          include ':app'
          EOF
          cat MCHosting/settings.gradle
          
          # Root settings.gradle de varsa duzelt
          if [ -f "settings.gradle" ]; then
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "sos-pro"
          include ':MCHosting:app'
          EOF
          fi

      - name: Proje Hazirla
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" | tee local.properties MCHosting/local.properties
          
          # app/build.gradle dataBinding fix
          if [ -f "MCHosting/app/build.gradle" ] && ! grep -q "dataBinding" MCHosting/app/build.gradle; then
            python3 <<PY
          import pathlib
          p=pathlib.Path("MCHosting/app/build.gradle")
          s=p.read_text()
          if "buildFeatures" not in s:
              s=s.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }",1)
              p.write_text(s)
              print("added buildFeatures to MCHosting/app/build.gradle")
          PY
          fi

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # ROOT MCHosting
          cd MCHosting
          pwd
          ls -la
          echo "=== build.gradle ==="
          cat build.gradle | head -30
          
          gradle assembleDebug --stacktrace --no-daemon

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
           
