name: MCHosting APK Yapici V3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: ZIP'i ac
        run: |
          ls -la
          # tum zipleri ac
          for z in *.zip; do
            [ -e "$z" ] && echo "Aciliyor: $z" && unzip -o "$z" && rm "$z"
          done
          # ic ice zip varsa
          for z in **/*.zip; do
            [ -e "$z" ] && unzip -o "$z" -d $(dirname "$z") && rm "$z"
          done || true
          ls -la
          # proje nerede?
          find . -name "gradlew" | head -20

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kur
        run: |
          echo "SDK kuruluyor..."
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3

      - name: dataBinding Fix
        run: |
          find . -name "build.gradle" -path "*/app/*" | head -5
          FILE=$(find . -name "build.gradle" | grep app | head -1)
          echo "Dosya: $FILE"
          if [ -f "$FILE" ]; then
            cat "$FILE"
            if ! grep -q "dataBinding" "$FILE"; then
              echo "Fix ekleniyor..."
              # android { dan sonra ekle
              sed -i '/^android {/a \    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }' "$FILE"
              cat "$FILE"
            fi
          fi

      - name: Gradle'a izin ver
        run: find . -name "gradlew" -exec chmod +x {} \;

      - name: APK Derle
        run: |
          # proje kokunu bul
          ROOT=$(find . -name "gradlew" | head -1 | xargs dirname)
          echo "Proje kok: $ROOT"
          cd "$ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: APK'yi Yükle
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
