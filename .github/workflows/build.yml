name: MCHosting V9 - Orijinal Surum Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP Ac
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done || true
          ls -la
          find . -name "gradle-wrapper.properties" -exec cat {} \;

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" || true

      - name: Versiyonlari Birlestir - 7.4.2 Sabitle
        run: |
          echo "=== Tum AGP surumleri 7.4.2 yapiliyor ==="
          # Projedeki tum AGP versiyonlarini 7.4.2 yap
          grep -r "com.android.tools.build:gradle" --include="*.gradle" . | head -20
          find . -name "*.gradle" -type f -exec sed -i -E "s/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/g" {} \; || true
          find . -name "*.gradle" -type f -exec sed -i -E "s/version '7.4.2'/version '7.4.2'/g" {} \; || true
          # plugins blokundaki AGP
          find . -name "*.gradle" -type f -exec sed -i -E "s/id 'com.android.application' version '[0-9.]+'/id 'com.android.application' version '7.4.2'/g" {} \; || true
          grep -r "com.android.tools.build:gradle" --include="*.gradle" . | head -20
          
          echo "=== Gradle Wrapper 7.6.3 sabit ==="
          find . -name "gradle-wrapper.properties" -exec sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-bin.zip|' {} \; || true
          find . -name "gradle-wrapper.properties" -exec cat {} \; || true

      - name: Proje Hazirla
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          find . -name "gradlew" -type f -exec chmod +x {} \; || true
          find . -name "gradlew" -type f | while read f; do dir=$(dirname "$f"); echo "sdk.dir=$ANDROID_HOME" > "$dir/local.properties"; done
          echo "sdk.dir=$ANDROID_HOME" > local.properties || true
          
          # dataBinding fix - AGP 7.x icin ESKI syntax
          APP=$(find . -type f -path "*app/build.gradle" | head -1)
          echo "APP=$APP"
          if [ -f "$APP" ]; then
            echo "=== Onceki APP ==="
            cat "$APP" | head -100
            # buildFeatures varsa sil, eski dataBinding ekle
            if ! grep -q "dataBinding" "$APP"; then
              python3 <<PY
          import pathlib
          p=pathlib.Path("$APP")
          s=p.read_text()
          # eski buildFeatures eklemesini temizle
          # AGP 7.x icin dogru syntax: buildFeatures { dataBinding true } CALISIR ama bazen eski enabled lazim
          # En uyumlu: android icine buildFeatures ekle
          if "buildFeatures" not in s:
              s=s.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }", 1)
              p.write_text(s)
              print("added buildFeatures")
          PY
            fi
            echo "=== Sonraki APP ==="
            cat "$APP" | head -200
          fi

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          GRADLEW=$(find . -type f -name "gradlew" | head -1)
          echo "GRADLEW=$GRADLEW"
          ROOT=$(dirname "$GRADLEW")
          echo "ROOT=$ROOT"
          cd "$ROOT"
          pwd
          ls -la
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
