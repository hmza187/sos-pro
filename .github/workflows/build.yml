name: MCHosting V12 - useAndroidX Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP Ac
        run: for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.6.3

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;30.0.3" || true

      - name: Settings + Properties Duzelt
        run: |
          cat > MCHosting/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MCHosting"
          include ':app'
          EOF
          
          # === EN ONEMLI FIX BURASI ===
          cat > MCHosting/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=34
          android.nonTransitiveRClass=true
          EOF
          
          cat MCHosting/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" | tee local.properties MCHosting/local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" > MCHosting/local.properties

      - name: dataBinding Fix
        run: |
          APP="MCHosting/app/build.gradle"
          if ! grep -q "dataBinding" "$APP"; then
            python3 <<PY
          import pathlib
          p=pathlib.Path("$APP")
          s=p.read_text()
          if "buildFeatures" not in s:
              s=s.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }",1)
              p.write_text(s)
          PY
          fi
          cat "$APP" | head -100

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          cd MCHosting
          gradle assembleDebug --stacktrace --no-daemon

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
