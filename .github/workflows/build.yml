name: MCHosting V7 - Space Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP Ac
        run: |
          set -x
          ls -la
          find . -maxdepth 3 -type f -name "*.zip" -print
          for z in *.zip; do [ -f "$z" ] && echo "Unzip $z" && unzip -o "$z"; done
          ls -la
          find . -type f -name "gradlew*" | head -20
          find . -type d | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK Kur
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Gradle Cache
        uses: gradle/gradle-build-action@v3

      - name: Proje Hazirla
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" | tee local.properties
          # Tum gradlew dosyalari icin
          find . -name "gradlew" -type f -exec chmod +x {} \;
          find . -name "gradlew" -type f -exec sh -c 'dir=$(dirname "$1"); echo "sdk.dir=$ANDROID_HOME" > "$dir/local.properties"; cat "$dir/local.properties"' _ {} \;
          # buildFeatures fix
          APP=$(find . -type f -path "*app/build.gradle" | head -1)
          if [ -z "$APP" ]; then APP=$(grep -rl "com.android.application" --include="*.gradle" . | head -1); fi
          echo "APP=$APP"
          if [ -f "$APP" ]; then
            python3 <<PY
          import pathlib, sys
          p = pathlib.Path("""$APP""".strip() or "")
          if not p.exists():
              sys.exit(0)
          t = p.read_text()
          if "buildFeatures" not in t:
              t = t.replace("android {", "android {\n    buildFeatures {\n        dataBinding true\n        viewBinding true\n    }", 1)
              p.write_text(t)
              print("fixed build.gradle")
          PY
          fi

      - name: APK Derle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          set -x
          GRADLEW=$(find . -type f -name "gradlew" | head -1)
          echo "GRADLEW=$GRADLEW"
          if [ -n "$GRADLEW" ]; then
            ROOT=$(dirname "$GRADLEW")
            echo "ROOT=$ROOT"
            cd "$ROOT"
            pwd
            ls -la
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew BULUNAMADI! Direkt gradle ile deniyorum..."
            SETTINGS=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
            ROOT=$(dirname "$SETTINGS")
            echo "SETTINGS ROOT=$ROOT"
            cd "$ROOT"
            pwd
            ls -la
            gradle assembleDebug --stacktrace
          fi

      - name: APK Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCHosting-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
