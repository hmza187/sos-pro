name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Zip'i aç
        run: unzip -o SosApp.zip -d .

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK komut satırı araçlarını kur
        uses: android-actions/setup-android@v3

      - name: Gradle'ı kur
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        run: gradle -p SosApp assembleDebug --stacktrace

      - name: APK'yı yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sos-app-debug-apk
          path: SosApp/app/build/outputs/apk/debug/app-debug.apk
          
